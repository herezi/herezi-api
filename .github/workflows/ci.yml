name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check

  integration:
    name: PostGIS 통합 테스트
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: herezi
          POSTGRES_PASSWORD: herezi
          POSTGRES_DB: herezi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U herezi -d herezi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HEREZI_TEST_DATABASE_URL: postgres://herezi:herezi@localhost:5432/herezi_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-integration
