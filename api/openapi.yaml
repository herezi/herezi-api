openapi: 3.1.0
info:
  title: Herezi API
  version: 0.11.0
  description: |
    Herezi 공개 API 계약. 이 파일이 서버·iOS·Android 사이의 단일 기준이다.
    변경 시 하위호환을 지키고, 앱 레포는 `make sync-api`로 이 파일을 가져간다.

    위치 비전송(0.8.0, 이슈 #74): 앱은 사용자 좌표를 서버로 보내지 않는다. 앱은 `GET /v1/regions/{region}/spots`(지역 전체 데이터)를
    받아 두고 거리·근처 목록·지도·정렬·검색을 기기에서 계산하며, 위치 이름은 기기 지오코더로 만든다.
    좌표를 받던 `/v1/spots`(근처)·`/v1/spots/map`·`/v1/geo/reverse`는 0.11.0에서 제거했다(아래).

    좌표 엔드포인트 제거(0.11.0, 이슈 #74, 2026-11-25): iOS·Android가 지역 파일 + 기기 계산으로 전환해 `GET /v1/spots`·
    `GET /v1/spots/map`·`GET /v1/geo/reverse`를 지웠다. 이 세 경로는 계약에 없고, 옛 앱 빌드(TestFlight 1–2, Play ≤4)가
    분명히 실패하도록 서버가 **410 Gone** + `Error`(`code=gone`)를 돌려준다(쿼리는 읽지 않는다). 새 클라이언트는 부르지 않는다.
    `GET /v1/spots/{id}`(상세)는 그대로다. 스키마 `SpotMap`·`GeoReverse`도 함께 지웠고, 기기 필터 값은 `When` 스키마로 남긴다.

    공지사항(0.9.0, 이슈 #80): `GET /v1/notices`·`GET /v1/notices/{id}`. 웹 공지 페이지(https://herezi.github.io/notices/)가
    브라우저에서 부르므로 이 두 경로에만 CORS를 연다(`https://herezi.github.io`, `http://localhost:*`, GET·OPTIONS).

    Apple 토큰 철회(0.10.0, 이슈 #72): `DELETE /v1/me` 요청 본문 `apple_authorization_code`(선택). Apple로 로그인한 사용자는
    탈퇴 직전 Sign in with Apple을 다시 해서 받은 authorization code를 보내야 하고, 서버가 Apple 토큰을 철회한 뒤에만 지운다.

    인증: 조회 API(`/v1/regions/*`, `/v1/spots/{id}`, `/v1/notices*`)는 인증 없이 쓴다. `/v1/me/*`만 로그인이 필요하다 —
    앱이 카카오·Apple로 로그인해 받은 **Supabase 세션의 access token**을 `Authorization: Bearer <JWT>`로 보낸다
    (TECH-PLAN.md §4.1). 401이면 세션을 리프레시해 한 번 다시 시도하고, 그래도 401이면 로그아웃 상태로 바꾼다.
    503 `auth_unavailable`은 일시적이므로 로그아웃하지 않는다.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }
  /v1/regions/{region}/spots:
    get:
      operationId: listRegionSpots
      summary: 지역 데이터 파일 — 앱이 받아 두고 근처·지도를 기기에서 계산한다 (좌표를 받지 않음)
      description: |
        지역(`region`)의 볼거리 전체를 한 번에 돌려준다. 앱은 사용자 좌표를 서버로 보내지 않고, 이 데이터로 거리 계산·반경·지도 영역·
        필터(`when`(스키마 `When`)·`category`·`free`)·정렬·키워드 검색을 기기에서 한다(SERVICE-PLAN §12 Q8, 이슈 #74).

        포함: **진행 중이거나 앞으로 90일 안에 시작**하는 항목 + **종료 후 90일 안**의 끝난 항목(저장 목록·상세가 오프라인에서도 보이게).
        앱은 목록·지도에서 여전히 끝난 항목(`ends_at` < 기기 현재 시각)을 숨긴다. 항목 순서는 `id`순.

        캐시: 강한 `ETag`(본문 내용 해시, gzip 표현은 다른 값)를 저장해 두었다가 `If-None-Match`로 보내면 바뀌지 않았을 때 304(본문 없음).
        `Cache-Control: public, max-age=3600`. 서버는 최대 10분마다 데이터를 다시 읽고, 내용이 같으면 `ETag`·`generated_at`을 유지한다
        (수집은 하루 1회). `Accept-Encoding: gzip`이면 `Content-Encoding: gzip`으로 보낸다(앱 HTTP 클라이언트가 자동으로 푼다).
      parameters:
        - name: region
          in: path
          required: true
          description: 지역 ID. 지금은 서울만 있다. 모르는 값은 404
          schema: { type: string, enum: [seoul] }
        - name: If-None-Match
          in: header
          description: 이전 응답의 `ETag`
          schema: { type: string }
      responses:
        "200":
          description: OK
          headers:
            ETag: { description: 강한 검증자(내용 해시), schema: { type: string } }
            Cache-Control: { schema: { type: string, example: "public, max-age=3600" } }
            Content-Encoding: { description: "`Accept-Encoding: gzip`일 때 gzip", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionSpots" }
        "304":
          description: 바뀌지 않음(`If-None-Match`가 현재 `ETag`와 같음). 본문 없음 — 기기에 저장한 데이터를 그대로 쓴다
        "404":
          description: 모르는 지역 (code=not_found)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/spots/{id}:
    get:
      operationId: getSpot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spot" }
        "404":
          description: 없음 (끝난 항목은 404가 아니라 200 + is_ended=true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/me/saved:
    get:
      operationId: listSaved
      summary: 내 저장(찜) 목록 — 저장 시각 최신순
      description: |
        저장한 볼거리의 스팟 스냅샷을 저장 시각(`saved_at`) 최신순으로 돌려준다. 끝난 항목도 포함하고 `is_ended: true`로
        표시한다(앱은 '끝난 볼거리' 섹션에 흐리게). 종료 후 90일이 지난 항목은 서버가 정리하므로 목록에서 빠진다.
        사용자당 최대 500개. 다음 페이지는 `next_cursor`를 그대로 보낸다. 응답은 `Cache-Control: no-store`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK. 각 항목에 `saved_at`이 있다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /v1/me/saved:import:
    post:
      operationId: importSaved
      summary: 기기 로컬 저장분을 계정으로 한 번에 옮기기 (최대 200개)
      description: |
        로그인 전(v1.3 이전 앱)에 기기에만 저장한 항목을 첫 로그인 때 옮긴다. 이미 저장된 항목은 그대로 두고(저장 시각 유지),
        서버에 없는 항목(정리된 볼거리 등)은 건너뛰고 `skipped_unknown`에 센다. 중복 ID는 한 번으로 친다.
        옮기면 500개를 넘는 경우 아무것도 저장하지 않고 409. 200이면 앱은 로컬 저장분을 모두 지워도 된다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedImportRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/SavedLimit" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /v1/me/saved/{spot_id}:
    put:
      operationId: saveSpot
      summary: 저장 (멱등)
      description: 이미 저장돼 있으면 아무것도 바꾸지 않고(저장 시각 유지) 204.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: spot_id, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "204": { description: 저장됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 없는 볼거리(정리됨 포함) (code=not_found)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/SavedLimit" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    delete:
      operationId: unsaveSpot
      summary: 저장 취소 (멱등)
      description: 저장돼 있지 않거나 없는 볼거리여도 204.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: spot_id, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "204": { description: 저장 취소됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /v1/me:
    delete:
      operationId: deleteMe
      summary: 회원 탈퇴 — Apple 토큰 철회(Apple 사용자), 저장 목록과 계정(Supabase 사용자)을 지운다
      description: |
        ⓪ Apple 제공자가 연결된 사용자(JWT `app_metadata.providers`에 `apple`)는 본문 `apple_authorization_code`로 Apple 토큰을
        철회한다(App Store 심사 지침 5.1.1(v)). 서버는 Apple 토큰을 저장하지 않으므로, 앱은 탈퇴 직전 Sign in with Apple을 다시 해서
        (scope 없음) 받은 authorization code(5분 유효, 한 번만 사용)를 보낸다. 서버는 코드를 토큰으로 바꾸고
        (`appleid.apple.com/auth/token`, client_id = 앱 번들 ID) refresh token을 철회한다(`/auth/revoke`).
        코드가 없거나 Apple이 거부하면 400 `apple_reauth_required`, Apple 서버 오류면 502 — 어느 쪽이든 **아무것도 지우지 않는다**.
        앱은 다시 인증해 새 코드로 재시도한다. 다른 제공자(카카오) 사용자는 본문이 없어도 되고, 보내도 무시한다.
        ① Supabase Auth Admin API로 사용자를 지우고(연결된 카카오·Apple 계정 정보 포함) ② 성공하면 저장 목록을 지운다.
        ①이 실패하면 502이고 저장 목록은 그대로다. 앱은 다시 시도하면 된다 — 이미 지워진 사용자는 성공으로 보고
        남은 정리를 마친다(멱등. Apple 사용자는 재시도에도 새 코드가 필요). 204 뒤에 앱은 세션·캐시·기기 로컬 저장을 모두 지운다.
        카카오 `unlink`는 앱이 먼저 한다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteMeRequest" }
      responses:
        "204": { description: 탈퇴 완료 }
        "400":
          description: |
            `apple_reauth_required` — Apple 사용자인데 `apple_authorization_code`가 없거나 Apple이 거부함(만료·재사용).
            `invalid_parameter` — 본문이 JSON 객체가 아니거나 너무 김(코드 2048자, 본문 8KB). 아무것도 지우지 않음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: 계정은 지워졌으나 저장 목록 정리 실패 (code=internal). 같은 토큰으로 재시도
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Apple 토큰 철회 실패 또는 Supabase 사용자 삭제 실패·타임아웃(각 10초) (code=upstream_error). 아무것도 지우지 않음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /v1/notices:
    get:
      operationId: listNotices
      summary: 공지사항 목록 — 게시된 공지만, 게시 시각 최신순, 최대 50개 (본문 없음)
      description: |
        게시된 공지(`published_at <= 요청 시각`, 숨김 아님)를 게시 시각 최신순(같으면 `id` 큰 것 먼저)으로 최대 50개 돌려준다.
        `published_at`이 미래인 공지(예약 게시)는 그 시각부터 보인다. 본문은 상세(`/v1/notices/{id}`)에서 받는다.
        `Cache-Control: public, max-age=60`.
        CORS: `Origin`이 `https://herezi.github.io` 또는 `http://localhost[:port]`이면 `Access-Control-Allow-Origin`에 그 출처를 돌려준다
        (`Vary: Origin`). 사전 요청(OPTIONS)은 204.
      responses:
        "200":
          description: "OK (공지가 없으면 `notices: []`)"
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeList" }
  /v1/notices/{id}:
    get:
      operationId: getNotice
      summary: 공지사항 상세 — 마크다운 본문 포함
      description: |
        게시된 공지 하나를 본문(마크다운 원문)과 함께 돌려준다. 렌더링은 클라이언트(웹 페이지)가 한다.
        `Cache-Control: public, max-age=60`. CORS는 목록과 같다.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: OK
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "404":
          description: 없음·숨김·게시 전, 또는 `id`가 양의 정수가 아님 (code=not_found)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase Auth access token(카카오·Apple 로그인 후 받은 세션). 서버는 프로젝트 JWKS(ES256/RS256)로 서명을,
        `iss`(`<SUPABASE_URL>/auth/v1`)·`aud`(`authenticated`)·`exp`를 확인하고 `sub`를 사용자 ID로 쓴다.
  responses:
    BadRequest:
      description: 잘못된 파라미터·본문 (code=invalid_parameter)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        토큰 없음·형식 오류·서명 불일치·만료·발급자/대상 불일치 (code=unauthorized). `WWW-Authenticate: Bearer` 헤더가 붙는다.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AuthUnavailable:
      description: |
        서버에 인증(또는 탈퇴용 서비스 키)이 설정되지 않음(code=auth_not_configured) 또는 검증 키(JWKS)를 일시적으로 받지 못함(code=auth_unavailable).
        토큰 문제가 아니므로 앱은 로그아웃하지 않고 나중에 다시 시도한다.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SavedLimit:
      description: 저장 개수 한도(500개) 초과 (code=saved_limit_exceeded)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Category:
      type: string
      enum: [nature, festival, performance, exhibition, popup, food, family, pet, sports]
    When:
      type: string
      enum: [now, today, weekend, week]
      default: now
      description: |
        기간 필터 값(KST 기준). 서버 요청 파라미터가 아니라 앱이 지역 파일을 기기에서 거를 때 쓰는 공통 값이다(#74).
    Spot:
      type: object
      required: [id, title, category, lat, lng, starts_at, source, fetched_at, is_ended]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string, description: GPT가 정리한 2~3줄 요약 }
        category: { $ref: "#/components/schemas/Category" }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        address: { type: string }
        place_name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        is_free: { type: boolean }
        image_url: { type: string, format: uri }
        source: { type: string, description: "tourapi | kopis | seoul_culture | ..." }
        source_url: { type: string, format: uri }
        fetched_at: { type: string, format: date-time, description: 원본 소스에서 마지막으로 가져온 시각(앱의 "갱신 시각") }
        distance_m: { type: integer, description: "요청 위치로부터의 거리. 이 값을 채우던 /v1/spots(근처)는 0.11.0에서 제거해 지금은 내려오지 않는다(하위호환으로 필드만 남김)" }
        saved_at: { type: string, format: date-time, description: "저장한 시각 (/v1/me/saved에서만)" }
        is_ended:
          type: boolean
          description: |
            응답 시각 기준으로 끝났는지(ends_at < now).
            상세(/v1/spots/{id})와 저장 목록(/v1/me/saved)은 끝난 항목도 반환하고 true로 표시한다 — 앱은 '종료됨'으로 보여준다(저장 목록에서 흐리게).
    RegionSpot:
      type: object
      description: |
        지역 데이터 파일의 항목. `Spot`과 같고 `distance_m`(기기에서 계산)·`saved_at`(저장 목록 전용)만 없다.
        `is_ended`는 `generated_at` 기준이므로 앱은 `ends_at`과 기기 현재 시각으로 다시 계산한다.
      required: [id, title, category, lat, lng, starts_at, source, fetched_at, is_ended]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string, description: GPT가 정리한 2~3줄 요약 }
        category: { $ref: "#/components/schemas/Category" }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        address: { type: string }
        place_name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        is_free: { type: boolean }
        image_url: { type: string, format: uri }
        source: { type: string }
        source_url: { type: string, format: uri }
        fetched_at: { type: string, format: date-time, description: 원본 소스에서 마지막으로 가져온 시각(앱의 "갱신 시각") }
        is_ended: { type: boolean, description: "generated_at 기준으로 끝났는지(ends_at < generated_at)" }
    RegionSpots:
      type: object
      required: [region, generated_at, count, items]
      properties:
        region: { type: string, example: seoul }
        generated_at: { type: string, format: date-time, description: 이 내용이 만들어진 시각(UTC). 내용이 바뀔 때만 바뀐다 }
        count: { type: integer, description: items 개수 }
        items:
          type: array
          items: { $ref: "#/components/schemas/RegionSpot" }
    SpotPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Spot" }
        next_cursor: { type: string }
    SavedImportRequest:
      type: object
      required: [spot_ids]
      properties:
        spot_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 200 }
    SavedImportResult:
      type: object
      required: [imported, skipped_unknown]
      properties:
        imported: { type: integer, description: 새로 저장한 수(이미 저장돼 있던 항목 제외) }
        skipped_unknown: { type: integer, description: 서버에 없어 건너뛴 수(정리된 볼거리 등) }
    NoticeSummary:
      type: object
      required: [id, title, published_at]
      properties:
        id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: 히어지 테스트를 시작했어요 }
        published_at: { type: string, format: date-time, description: 게시 시각(KST 오프셋 +09:00로 표기), example: "2026-11-25T00:00:00+09:00" }
    NoticeList:
      type: object
      required: [notices]
      properties:
        notices:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/NoticeSummary" }
    Notice:
      type: object
      required: [id, title, body, published_at]
      properties:
        id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: 히어지 테스트를 시작했어요 }
        body: { type: string, description: 본문(마크다운 원문) }
        published_at: { type: string, format: date-time, description: 게시 시각(KST 오프셋 +09:00로 표기), example: "2026-11-25T00:00:00+09:00" }
    DeleteMeRequest:
      type: object
      properties:
        apple_authorization_code:
          type: string
          maxLength: 2048
          description: 탈퇴 직전 Sign in with Apple 재인증으로 받은 authorization code. Apple 사용자만 필수
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            invalid_parameter · not_found · internal · not_configured · upstream_error(502) · gone(410, #74에서 제거한 경로) ·
            unauthorized(401) · auth_not_configured(503) · auth_unavailable(503) · saved_limit_exceeded(409) ·
            apple_reauth_required(400)
        message: { type: string }
